name: CD-OpenShift

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod   # protège le déploiement (approbations si activées)
    needs: []           # si tu veux forcer l’ordre: mets needs: [build-test-image] et déclenche via "workflow_run"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get commit SHA tag
        id: vars
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: oc login
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}

      - name: Apply K8s manifests
        run: |
          oc apply -f k8s/openshift/deployment.yaml
          oc apply -f k8s/openshift/service.yaml
          oc apply -f k8s/openshift/route.yaml

      - name: Set image to GHCR sha
        run: |
          oc set image deployment/delivery-scheduler \
            delivery-scheduler=ghcr.io/OWNER/REPO:${{ steps.vars.outputs.TAG }} --record=true

      - name: Wait rollout
        run: oc rollout status deployment/delivery-scheduler --timeout=180s

      - name: Show route
        run: oc get route delivery-scheduler -o wide
