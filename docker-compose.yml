# docker-compose.yml
name: delivery-scheduler

services:
  api:
    build: .
    image: delivery-scheduler:latest
    container_name: delivery-scheduler
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL=gpt-4o-mini
      - SERVER_PORT=8080
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 10
    #   start_period: 30s
