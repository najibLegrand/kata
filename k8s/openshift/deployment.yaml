apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-scheduler
  template:
    metadata:
      labels:
        app: delivery-scheduler
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/delivery-scheduler:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
