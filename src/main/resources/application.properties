# Datasource (H2 in memory)
spring.datasource.url=jdbc:h2:mem:deliverydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
auto-configure.exclude=
spring.jpa.hibernate.ddl-auto=update

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SpringAI
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.timeout=8s
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=120
spring.ai.openai.chat.options.seed=42

# Seed (active en dev, desactive en test via @Profile)
app.seed.enabled=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
# A desactiver en Prod (false)
springdoc.api-docs.enabled=true
#springdoc.swagger-ui.enabled=false

# ================================
# Observabilité / Actuator
# ================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,env
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator
server.shutdown=graceful