# Datasource (H2 in?memory)
spring.datasource.url=jdbc:h2:mem:deliverydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
auto-configure.exclude=
spring.jpa.hibernate.ddl-auto=update

# H2 console
spring.h2.console.enabled=true

# SpringAI
spring.ai.openai.api-key=${OPENAI_API_KEY:changeme}